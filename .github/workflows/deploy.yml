# Lesson 12 - "Deploy Meera's Bakery to AWS" (static website on S3).
# Trigger: push to main that changes the static/ folder, or run it by hand.
#
# One-time setup (repo -> Settings):
#   Secrets  : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, STATIC_BUCKET
#   Variables: DEPLOY_ENABLED = true      (safety switch - deploys stay off until you set it)
name: Deploy Meera's Bakery to AWS

on:
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  deploy-static:
    needs: test
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync ./static s3://${{ secrets.STATIC_BUCKET }} --delete
          echo "Deployed to bucket ${{ secrets.STATIC_BUCKET }}"
