# Lesson 14 - Complete DevOps pipeline:
#   push -> test -> build Docker image -> push to Amazon ECR -> deploy to EC2
#
# Secrets  : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#            ECR_URI (e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/meera-bakery),
#            EC2_HOST, EC2_USER (ec2-user on Amazon Linux), EC2_SSH_KEY (private key text)
# Variables: DEPLOY_ENABLED = true
name: Meera's Bakery - Docker to ECR to EC2

on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", "requirements.txt", ".github/workflows/pipeline-docker.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build-and-deploy:
    needs: test
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t meera-bakery:${{ github.sha }} .

      - name: Push image to ECR
        run: |
          docker tag meera-bakery:${{ github.sha }} ${{ secrets.ECR_URI }}:${{ github.sha }}
          docker tag meera-bakery:${{ github.sha }} ${{ secrets.ECR_URI }}:latest
          docker push ${{ secrets.ECR_URI }}:${{ github.sha }}
          docker push ${{ secrets.ECR_URI }}:latest

      - name: Deploy to EC2 (via SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGISTRY=$(echo "${{ secrets.ECR_URI }}" | cut -d/ -f1)
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin "$REGISTRY"
            docker pull ${{ secrets.ECR_URI }}:latest
            docker stop bakery || true
            docker rm bakery || true
            docker run -d --name bakery --restart unless-stopped -p 80:8000 \
              -e APP_ENV=prod \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e USE_PARAMETER_STORE=true \
              ${{ secrets.ECR_URI }}:latest
